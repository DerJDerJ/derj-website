<!doctype html><html lang="de"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>DerJ · Text-Editor</title>
<style>
:root{--bg:#0b0b0f;--card:#14141b;--line:#26262f;--ink:#e8e6f0;--mut:#8f8aa0;--acid:#b6ff00;--hot:#ff2d55}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,Segoe UI,sans-serif}
header{position:sticky;top:0;background:#0b0b0fee;backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 18px;z-index:5}
h1{font-size:16px;margin:0 0 4px}
.sub{color:var(--mut);font-size:12.5px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
button{font:inherit;background:#1c1c25;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--hot)}
button.primary{background:var(--acid);color:#0b0b0f;border-color:var(--acid);font-weight:700}
main{max-width:920px;margin:0 auto;padding:12px 18px 60px}
.grp{margin:26px 0 8px;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--hot);border-bottom:1px solid var(--line);padding-bottom:6px}
.item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0}
.item.changed{border-color:var(--acid)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:7px}
.meta{font-size:11px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{display:inline-block;background:#22222c;border-radius:5px;padding:1px 6px;margin-right:6px;font-family:ui-monospace,monospace;color:#c9c6d8}
textarea{width:100%;background:#0e0e14;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px;font:13px/1.5 ui-monospace,monospace;resize:vertical}
.sw{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--mut);user-select:none;cursor:pointer;white-space:nowrap}
.sw input{appearance:none;-webkit-appearance:none;width:40px;height:21px;background:#2a2a34;border-radius:20px;position:relative;cursor:pointer;transition:.15s;margin:0;flex:0 0 auto}
.sw input:checked{background:var(--acid)}
.sw input::after{content:"";position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:#fff;transition:.15s}
.sw input:checked::after{transform:translateX(19px)}
.glitchword{color:var(--hot);font-weight:600}
#out{width:100%;height:130px;margin-top:10px;display:none;background:#0e0e14;color:#cfcbe0;border:1px solid var(--line);border-radius:8px;padding:8px;font:12px/1.45 ui-monospace,monospace}
footer{color:var(--mut);font-size:12px;padding:20px;text-align:center;border-top:1px solid var(--line)}
.hint{background:#101a10;border:1px solid #24361f;color:#d7f5cf;border-radius:8px;padding:10px 12px;font-size:13px;margin-top:10px}
kbd{background:#22222c;border:1px solid var(--line);border-radius:4px;padding:0 5px;font-family:ui-monospace,monospace}
</style></head><body>
<header>
  <h1>DerJ · Text-Editor</h1>
  <div class="sub">Texte direkt anpassen &amp; pro Zeile schalten, ob der Text <span class="glitchword">glitchen</span> soll. Am Ende <b>Exportieren</b> → die <code>derj-texte.json</code> an Rick schicken.</div>
  <div class="bar">
    <button class="primary" id="exp">⬇ Exportieren (JSON)</button>
    <button id="copy">📋 JSON anzeigen/kopieren</button>
    <button id="allOn">Alle glitchen</button>
    <button id="allOff">Keine glitchen</button>
    <button id="reset">Zurücksetzen</button>
    <span class="meta" id="cnt"></span>
  </div>
  <textarea id="out" readonly spellcheck="false"></textarea>
</header>
<main id="main"></main>
<footer>Autosave läuft lokal im Browser (localStorage). Es wird nichts hochgeladen.</footer>

var DATA = [{"tag":"a","sec":"flex","text":"DERJ","path":"div#root > header.fixed.top-0 > nav.flex.items-center > a.display.text-[22px]"},{"tag":"a","sec":"flex","text":"Über","path":"header.fixed.top-0 > nav.flex.items-center > ul.hidden.lg:flex > li > a.font-mono.text-[11px]"},{"tag":"a","sec":"flex","text":"Musik","path":"header.fixed.top-0 > nav.flex.items-center > ul.hidden.lg:flex > li > a.font-mono.text-[11px]"},{"tag":"a","sec":"flex","text":"Termine","path":"header.fixed.top-0 > nav.flex.items-center > ul.hidden.lg:flex > li > a.font-mono.text-[11px]"},{"tag":"a","sec":"flex","text":"Licht","path":"header.fixed.top-0 > nav.flex.items-center > ul.hidden.lg:flex > li > a.font-mono.text-[11px]"},{"tag":"a","sec":"flex","text":"Mapping","path":"header.fixed.top-0 > nav.flex.items-center > ul.hidden.lg:flex > li > a.font-mono.text-[11px]"},{"tag":"a","sec":"flex","text":"Mixtapes","path":"header.fixed.top-0 > nav.flex.items-center > ul.hidden.lg:flex > li > a.font-mono.text-[11px]"},{"tag":"a","sec":"flex","text":"Kunst","path":"header.fixed.top-0 > nav.flex.items-center > ul.hidden.lg:flex > li > a.font-mono.text-[11px]"},{"tag":"a","sec":"flex","text":"Kontakt","path":"header.fixed.top-0 > nav.flex.items-center > ul.hidden.lg:flex > li > a.font-mono.text-[11px]"},{"tag":"button","sec":"flex","text":"⬡ Underground","path":"div#root > header.fixed.top-0 > nav.flex.items-center > div.flex.items-center > button.btn.btn-hot"},{"tag":"a","sec":"-","text":"Start","path":"div#root > aside.hidden.xl:flex > a.group.flex"},{"tag":"a","sec":"-","text":"00 Über","path":"div#root > aside.hidden.xl:flex > a.group.flex"},{"tag":"a","sec":"-","text":"01 Sound","path":"div#root > aside.hidden.xl:flex > a.group.flex"},{"tag":"a","sec":"-","text":"02 Termine","path":"div#root > aside.hidden.xl:flex > a.group.flex"},{"tag":"a","sec":"-","text":"03 Licht","path":"div#root > aside.hidden.xl:flex > a.group.flex"},{"tag":"a","sec":"-","text":"04 Raum","path":"div#root > aside.hidden.xl:flex > a.group.flex"},{"tag":"a","sec":"-","text":"05 Hören","path":"div#root > aside.hidden.xl:flex > a.group.flex"},{"tag":"a","sec":"-","text":"06 Kunst","path":"div#root > aside.hidden.xl:flex > a.group.flex"},{"tag":"a","sec":"-","text":"07 Kontakt","path":"div#root > aside.hidden.xl:flex > a.group.flex"},{"tag":"p","sec":"hero","text":"DJ · Licht-Designer · Veranstalter","path":"section#hero > div.text-center > p.eyebrow.mb-4"},{"tag":"h1","sec":"hero","text":"DERJR","path":"section#hero > div.text-center > h1.display.text-acid"},{"tag":"p","sec":"hero","text":"hören. sehen.tanzen.","path":"section#hero > div.grid.md:grid-cols-3 > div.md:text-right.scrim > p.font-black.lowercase"},{"tag":"p","sec":"hero","text":"Techno. Licht. Raum. Drei Disziplinen, eine Nacht — gebaut für diejenigen, die nicht nur hören, sondern sehen.","path":"section#hero > div.grid.md:grid-cols-3 > div.md:text-right.scrim > p.lede.max-w-md"},{"tag":"a","sec":"hero","text":"Hören","path":"section#hero > div.grid.md:grid-cols-3 > div.md:text-right.scrim > div.mt-5.flex > a.btn.btn-acid"},{"tag":"a","sec":"hero","text":"Booking","path":"section#hero > div.grid.md:grid-cols-3 > div.md:text-right.scrim > div.mt-5.flex > a.btn.btn-ghost"},{"tag":"h2","sec":"about","text":"Sound trifft Raum.","path":"section#about > div.relative.z-10 > div.scrim.lg:col-span-6 > div > h2.display.text-[clamp(2.5rem,5.6vw,5.4rem)]"},{"tag":"p","sec":"about","text":"Seit 2008 steht DerJ in Münchner Clubs — hinter den Decks, am Lichtpult, manchmal mit Projektionen und manchmal mit der Dose an der Wand. Was als DJ-Set begann, wurde zu einem Way of Life: Techno, der sichtbar wird. Licht, das den Takt hält. Räume, die sich verformen, sobald der Bass fällt.","path":"section#about > div.relative.z-10 > div.scrim.lg:col-span-6 > div > p.lede.mt-8"},{"tag":"p","sec":"about","text":"Drei Disziplinen, eine Handschrift. Keine Auftritte nach Baukasten — jede Nacht wird gebaut, nicht zusammengestellt. Roh, präzise, kompromisslos. Wer einmal dabei war, weiß, dass es nicht um teure Bookings geht. Es geht darum, einen Raum so aufzuladen, dass er magisch bleibt — bis der Letzte geht.","path":"section#about > div.relative.z-10 > div.scrim.lg:col-span-6 > div > p.lede.mt-5"},{"tag":"p","sec":"about","text":"Gebaut in München. Gespielt auf dem Feel Festival, im Harry Klein, Rote Sonne, Bahnwärter Thiel und überall dort, wo der Bass tief genug ist.","path":"section#about > div.relative.z-10 > div.scrim.lg:col-span-6 > div > p.mt-8.font-mono"},{"tag":"h2","sec":"music","text":"DJ / Musik","path":"section#music > div.relative.z-10 > div.scrim.lg:col-span-6 > div > h2.display.text-[clamp(2.5rem,5.6vw,5.4rem)]"},{"tag":"p","sec":"music","text":"Treibender, hypnotischer Techno. Lange Bögen, präzise Übergänge, ein Set, das sich wie ein einziger Atemzug durch die Nacht zieht — von dunklem Hall bis zum gleißenden Peak. Kein Spiel mit Hits. Ein Bauwerk aus Druck, Dichte und dem Moment, in dem der Raum kippt.","path":"section#music > div.relative.z-10 > div.scrim.lg:col-span-6 > div > p.lede.mt-8"},{"tag":"p","sec":"music","text":"Opening: langsam aufbauen, Halle weiten, Raum geben. Peak-Time: treibend, direkt, kein Entkommen. Closing: der letzte Bogen, wenn die Lichter schon brennen und der Bass noch nicht gehen will. Drei Phasen, eine Linie — der Bogen hält durch, egal wie lang die Nacht wird.","path":"section#music > div.relative.z-10 > div.scrim.lg:col-span-6 > div > p.lede.mt-5"},{"tag":"h2","sec":"gigs","text":"Upcoming Gigs","path":"div.relative.z-10 > div.scrim.lg:col-span-8 > div.text-center > div > h2.display.text-[clamp(2.5rem,5.6vw,5.4rem)]"},{"tag":"p","sec":"gigs","text":"Wo es als Nächstes passiert. Kommende Dates — bevor sie irgendwo anders stehen.","path":"div.relative.z-10 > div.scrim.lg:col-span-8 > div.text-center > div > p.lede.mt-6"},{"tag":"p","sec":"gigs","text":"Weitere Dates folgen. Instagram für aktuelles Line-up: @derj.official","path":"section#gigs > div.relative.z-10 > div.scrim.lg:col-span-8 > div > p.mt-5.font-mono"},{"tag":"a","sec":"gigs","text":"@derj.official","path":"div.relative.z-10 > div.scrim.lg:col-span-8 > div > p.mt-5.font-mono > a.text-ink.hover:text-hot"},{"tag":"p","sec":"gigs","text":"Wo es passiert ist — Festivals, Clubs und Underground-Locations, gespielt in den letzten Jahren. Klick auf einen Namen für mehr.","path":"div.relative.z-10 > div.scrim.lg:col-span-8 > div.mt-20.text-center > div > p.lede.max-w-xl"},{"tag":"a","sec":"gigs","text":"Feel Festival ↗","path":"div > div.mt-10.grid > div > div.flex.flex-wrap > a.chip.chip-major"},{"tag":"a","sec":"gigs","text":"Wilde Möhre ↗","path":"div > div.mt-10.grid > div > div.flex.flex-wrap > a.chip.chip-major"},{"tag":"a","sec":"gigs","text":"Rote Sonne ↗","path":"div > div.mt-10.grid > div > div.flex.flex-wrap > a.chip.chip-major"},{"tag":"a","sec":"gigs","text":"Harry Klein ↗","path":"div > div.mt-10.grid > div > div.flex.flex-wrap > a.chip.chip-major"},{"tag":"a","sec":"gigs","text":"Bahnwärter Thiel ↗","path":"div > div.mt-10.grid > div > div.flex.flex-wrap > a.chip.chip-major"},{"tag":"a","sec":"gigs","text":"Unter Deck ↗","path":"div > div.mt-10.grid > div > div.flex.flex-wrap > a.chip"},{"tag":"a","sec":"gigs","text":"Lieberscholli ↗","path":"div > div.mt-10.grid > div > div.flex.flex-wrap > a.chip"},{"tag":"a","sec":"gigs","text":"Pimpernel ↗","path":"div > div.mt-10.grid > div > div.flex.flex-wrap > a.chip"},{"tag":"h2","sec":"lighting","text":"Lighting Design","path":"section#lighting > div.relative.z-10 > div.scrim.lg:col-span-6 > div > h2.display.text-[clamp(2.5rem,5.6vw,5.4rem)]"},{"tag":"p","sec":"lighting","text":"Lichtdesign für Clubs, Events und Produktionen — vom Konzept bis zur letzten Gobo. Moving Heads, Beams, Strobes: jedes Fixture programmiert, jeder Cue getaktet. Visualisierungen vorab, Timecode-gesteuert oder manuell am Pult — je nachdem, was die Nacht verlangt.","path":"section#lighting > div.relative.z-10 > div.scrim.lg:col-span-6 > div > p.lede.mt-8"},{"tag":"p","sec":"lighting","text":"Licht als zweites Instrument. Bewegliche Beams zeichnen Formationen in den Haze — X, V, W. Pulse, die den Bass übersetzen. Strobes, die den Raum für einen Moment auslöschen. Atmosphäre entsteht nicht durch Zufall, sondern durch Programmierung — und manchmal durch ein Gewitter, das einfach kommt.","path":"section#lighting > div.relative.z-10 > div.scrim.lg:col-span-6 > div > p.lede.mt-5"},{"tag":"p","sec":"lighting","text":"→ Auf dieser Seite folgen die Lichter deiner Maus und reagieren auf den Scroll — ein Vorgeschmack darauf, was im Club passiert, wenn das Pult live schaltet.","path":"section#lighting > div.relative.z-10 > div.scrim.lg:col-span-6 > div > p.mt-5.font-mono"},{"tag":"h2","sec":"projection","text":"Projection Mapping","path":"div.relative.z-10 > div.scrim.lg:col-span-8 > div.text-center > div > h2.display.text-[clamp(2.5rem,5.6vw,5.4rem)]"},{"tag":"p","sec":"projection","text":"Engine: TouchDesigner und GLSL — pixelgenau gemappt, getimet und auf den Raum abgestimmt. Jede Oberfläche ist eine andere Story. Eine Wand bleibt nicht Wand. Sie wird Bild, Rhythmus, Stimmung — und wenn der Bass fällt, bricht sie auf.","path":"section#projection > div.relative.z-10 > div.scrim.lg:col-span-8 > div > p.lede.mt-5"},{"tag":"p","sec":"projection","text":"→ Auf dieser Seite verzerrt der Scroll das Raster in Echtzeit — ein Eindruck davon, wie Mapping einen Raum verformt, wenn man ihn live erlebt.","path":"section#projection > div.relative.z-10 > div.scrim.lg:col-span-8 > div > p.mt-5.font-mono"},{"tag":"h2","sec":"releases","text":"Mixtapes","path":"section#releases > div.relative.z-10 > div.scrim.lg:col-span-6 > div > h2.display.text-[clamp(2.5rem,5.6vw,5.4rem)]"},{"tag":"p","sec":"releases","text":"Sets und Mixtapes in voller Länge — direkt von SoundCloud. Hypnotische Bögen, treibende Rhythmen, Übergänge, die nicht trennen, sondern tragen. Aufgenommen in einem Rutsch, gespielt wie live — kein Edit, keine Pause, ein einziger Bogen.","path":"section#releases > div.relative.z-10 > div.scrim.lg:col-span-6 > div > p.lede.mt-8"},{"tag":"p","sec":"releases","text":"Wer wissen will, wie ein DerJ-Set klingt, ohne in den Club zu gehen: hier reinhören. Wer danach wissen will, wie es sich anfühlt: kommen.","path":"section#releases > div.relative.z-10 > div.scrim.lg:col-span-6 > div > p.lede.mt-5"},{"tag":"button","sec":"releases","text":"SoundCloud Player ladenVerbindet zu SoundCloud · Datenschutz beachten","path":"div.relative.z-10 > div.scrim.lg:col-span-6 > div > div.mt-10.border > button.group.w-full"},{"tag":"p","sec":"releases","text":"Alle Mixtapes: soundcloud.com/derj-official ↗","path":"section#releases > div.relative.z-10 > div.scrim.lg:col-span-6 > div > p.mt-5.font-mono"},{"tag":"a","sec":"releases","text":"soundcloud.com/derj-official ↗","path":"div.relative.z-10 > div.scrim.lg:col-span-6 > div > p.mt-5.font-mono > a.text-ink.hover:text-hot"},{"tag":"h2","sec":"art","text":"Graffiti","path":"section#art > div.relative.z-10 > div.scrim.lg:col-span-6 > div > h2.display.text-[clamp(2.5rem,5.6vw,5.4rem)]"},{"tag":"p","sec":"art","text":"Aerosol, Schablone, Wall — die visuelle Sprache hinter dem Projekt. Seit den frühen Tagen auf Wänden in München und darüber hinaus. Freehand und Schablone, manchmal beide in einem Stück: die Struktur der Schablone gegen die Energie der freien Hand.","path":"section#art > div.relative.z-10 > div.scrim.lg:col-span-6 > div > p.lede.mt-8"},{"tag":"p","sec":"art","text":"Graffiti ist kein Side-Projekt. Es ist die dritte Disziplin — der visuelle Bass. Dieselbe Energie, die im Set nach vorn drückt, landet hier auf der Wand. Roh, urban, direkt. Kein Atelier, keine Leinwand. Die Wand ist die Bühne, die Dose das Instrument.","path":"section#art > div.relative.z-10 > div.scrim.lg:col-span-6 > div > p.lede.mt-5"},{"tag":"p","sec":"art","text":"[Foto-Galerie folgt — DerJ bereitet einen Ordner mit Bildern vor.]","path":"section#art > div.relative.z-10 > div.scrim.lg:col-span-6 > div > p.mt-4.font-mono"},{"tag":"h2","sec":"contact","text":"Booking & Kontakt","path":"section#contact > div.relative.z-10 > div.scrim.lg:col-span-6 > div > h2.display.text-[clamp(2.5rem,5.6vw,5.4rem)]"},{"tag":"p","sec":"contact","text":"DJ-Booking. Lichtproduktion. Projection Mapping. Kollaborationen. Was auch immer du vorhast — wenn es um Sound, Licht oder Raum geht, schreib direkt.","path":"section#contact > div.relative.z-10 > div.scrim.lg:col-span-6 > div > p.lede.mt-8"},{"tag":"p","sec":"contact","text":"Kurz was du brauchst, wann, wo. Du bekommst Antwort — meistens am selben Tag. Für Seriöses gibt es Tech-Rider und Press-Kit auf Anfrage.","path":"section#contact > div.relative.z-10 > div.scrim.lg:col-span-6 > div > p.lede.mt-5"},{"tag":"button","sec":"contact","text":"Senden →","path":"div.scrim.lg:col-span-6 > div > form.mt-10.grid > div.sm:col-span-2.flex > button.btn.btn-acid"},{"tag":"a","sec":"contact","text":"booking@derj.de","path":"div > form.mt-10.grid > div.sm:col-span-2.flex > span.font-mono.text-xs > a.text-ink.hover:text-hot"},{"tag":"a","sec":"contact","text":"Instagram ↗","path":"div.relative.z-10 > div.scrim.lg:col-span-6 > div > div.mt-10.flex > a.font-mono.text-[11px]"},{"tag":"a","sec":"contact","text":"SoundCloud ↗","path":"div.relative.z-10 > div.scrim.lg:col-span-6 > div > div.mt-10.flex > a.font-mono.text-[11px]"},{"tag":"a","sec":"contact","text":"Facebook ↗","path":"div.relative.z-10 > div.scrim.lg:col-span-6 > div > div.mt-10.flex > a.font-mono.text-[11px]"},{"tag":"a","sec":"contact","text":"RA ↗","path":"div.relative.z-10 > div.scrim.lg:col-span-6 > div > div.mt-10.flex > a.font-mono.text-[11px]"},{"tag":"a","sec":"contact","text":"Mail ↗","path":"div.relative.z-10 > div.scrim.lg:col-span-6 > div > div.mt-10.flex > a.font-mono.text-[11px]"},{"tag":"a","sec":"site-footer","text":"Impressum","path":"footer#site-footer > div.bg-void/90.backdrop-blur-sm > div.max-w-[1400px].mx-auto > div.font-mono.text-[11px] > a.hover:text-hot.transition-colors"},{"tag":"a","sec":"site-footer","text":"Datenschutz","path":"footer#site-footer > div.bg-void/90.backdrop-blur-sm > div.max-w-[1400px].mx-auto > div.font-mono.text-[11px] > a.hover:text-hot.transition-colors"},{"tag":"a","sec":"site-footer","text":"Nach oben ↑","path":"footer#site-footer > div.bg-void/90.backdrop-blur-sm > div.max-w-[1400px].mx-auto > a.btn.btn-ghost"},{"tag":"p","sec":"site-footer","text":"stay healthy. stay hydrated. let us dance.","path":"footer#site-footer > div.bg-void/90.backdrop-blur-sm > p.max-w-[1400px].mx-auto"}];
var SECNAME = {"hero":"Hero / Start","about":"Über","music":"DJ / Musik","gigs":"Termine / Gigs","lighting":"Licht","projection":"Mapping","releases":"Mixtapes","art":"Kunst / Graffiti","contact":"Kontakt","site-footer":"Footer","flex":"Navigation / Header","-":"Sonstiges"};
var LS = "derj-text-editor-v1";
var state = DATA.map(function(d){ return { text: d.text, glitch: true }; });
try { var saved = JSON.parse(localStorage.getItem(LS) || "null"); if (Array.isArray(saved) && saved.length === DATA.length) state = saved; } catch (e) {}
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function save(){ try { localStorage.setItem(LS, JSON.stringify(state)); } catch (e) {} }
function cnt(){ var on = state.filter(function(s){ return s.glitch; }).length; document.getElementById("cnt").textContent = on + " / " + state.length + " glitchen · " + state.filter(function(s,i){ return s.text !== DATA[i].text; }).length + " geändert"; }
function render(){
  var main = document.getElementById("main"); main.innerHTML = "";
  var secs = []; DATA.forEach(function(d){ if (secs.indexOf(d.sec) < 0) secs.push(d.sec); });
  secs.forEach(function(sec){
    var h = document.createElement("div"); h.className = "grp"; h.textContent = SECNAME[sec] || sec; main.appendChild(h);
    DATA.forEach(function(d, i){ if (d.sec !== sec) return;
      var it = document.createElement("div"); it.className = "item" + (state[i].text !== d.text ? " changed" : "");
      it.innerHTML = '<div class="row"><div class="meta"><span class="tag">' + d.tag + '</span>' + esc(d.path || "") + '</div>' +
        '<label class="sw"><input type="checkbox" data-i="' + i + '"' + (state[i].glitch ? " checked" : "") + '><span class="glitchword">Glitch</span></label></div>' +
        '<textarea data-i="' + i + '" rows="2" spellcheck="false">' + esc(state[i].text) + '</textarea>';
      main.appendChild(it);
    });
  });
  cnt();
}
document.getElementById("main").addEventListener("input", function(e){
  var i = e.target.getAttribute("data-i"); if (i === null) return; i = +i;
  if (e.target.tagName === "TEXTAREA") { state[i].text = e.target.value; e.target.closest(".item").classList.toggle("changed", state[i].text !== DATA[i].text); }
  if (e.target.type === "checkbox") state[i].glitch = e.target.checked;
  save(); cnt();
});
function payload(){ return { site: "derj-website", version: 1, exported: new Date().toISOString(),
  items: DATA.map(function(d,i){ return { sec: d.sec, tag: d.tag, path: d.path, orig: d.text, text: state[i].text, glitch: state[i].glitch, changed: state[i].text !== d.text }; }) }; }
document.getElementById("exp").onclick = function(){
  var b = new Blob([JSON.stringify(payload(), null, 1)], { type: "application/json" });
  var a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = "derj-texte.json"; document.body.appendChild(a); a.click(); a.remove();
};
document.getElementById("copy").onclick = function(){
  var t = JSON.stringify(payload(), null, 1); var o = document.getElementById("out"); o.style.display = "block"; o.value = t; o.focus(); o.select();
  try { navigator.clipboard.writeText(t); } catch (e) {}
};
document.getElementById("allOn").onclick = function(){ state.forEach(function(s){ s.glitch = true; }); save(); render(); };
document.getElementById("allOff").onclick = function(){ state.forEach(function(s){ s.glitch = false; }); save(); render(); };
document.getElementById("reset").onclick = function(){ if (!confirm("Alle Änderungen verwerfen?")) return; state = DATA.map(function(d){ return { text: d.text, glitch: true }; }); save(); render(); };
render();
</script></body></html>
